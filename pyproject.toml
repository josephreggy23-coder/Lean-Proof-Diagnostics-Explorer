[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-proof-diagnostics"
version = "0.1.0"
description = "Transparent analysis of Lean proof-attempt diagnostics."
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/josephreggy23-coder/Lean-Proof-Diagnostics-Explorer"
Issues = "https://github.com/josephreggy23-coder/Lean-Proof-Diagnostics-Explorer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
